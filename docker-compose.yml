services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build: ./ml-service
    restart: unless-stopped
    environment:
      ML_MODE: ${ML_MODE:-demo}
      MODEL_PATH: models/plant_disease_model.keras
      CLASS_NAMES_PATH: models/class_names.json
    ports: ["8000:8000"]

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongodb: { condition: service_healthy }
      ml-service: { condition: service_started }
    environment:
      NODE_ENV: production
      PORT: 5000
      STORAGE_MODE: mongo
      MONGODB_URI: mongodb://mongodb:27017/plant_disease
      ML_SERVICE_URL: http://ml-service:8000
      CORS_ORIGINS: http://localhost:8080
    volumes: [uploads_data:/app/uploads]
    ports: ["5000:5000"]

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    ports: ["8080:80"]

volumes:
  mongo_data:
  uploads_data:
